name: Review project metadata
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-projects.mjs
      - run: node --test
      - run: node scripts/refresh-github-metadata.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-metadata-review
          path: data/github-metadata.json
